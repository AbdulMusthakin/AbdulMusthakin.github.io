# GitHub Pages settings.
# Files listed under exclude stay in the repository (and on your computer) but are not published.
exclude:
  - old-index.html
  - old-notes.html
  - notes/note-template.html
  - notes/article-template.html
  - README.md
  - drafted-text.md
  - CLAUDE.md
  # drafts: list a page here to keep it unpublished, and delete its line to publish it
